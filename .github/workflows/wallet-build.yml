name: Build wallet UI on GitHub
on:
  push:
    branches: [gh-pages]
    paths: ['wallet-ui/**', 'contracts/PracticeDeposit.sol', '.github/workflows/wallet-build.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock=false
        working-directory: wallet-ui
      - run: npm run build
        working-directory: wallet-ui
      - run: npm run contract
        working-directory: wallet-ui
      - uses: actions/upload-artifact@v4
        with:
          name: wallet-assets
          path: wallet-assets/
      # The contract test above must pass before anything is published.
      - name: Publish built wallet assets
        run: |
          set -euo pipefail
          if git diff --quiet -- wallet-assets; then
            echo "wallet-assets unchanged; nothing to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wallet-assets
          git commit -m "ci: publish wallet assets and verified practice contract artifact"
          git push origin HEAD:${{ github.ref_name }}
