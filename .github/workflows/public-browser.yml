name: Public Pages browser test
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:
jobs:
  public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      # Both origins must serve the commit under test: a broken CNAME must not
      # hide behind a healthy github.io fallback.
      - run: node tests/public-browser.cjs
        env:
          PUBLIC_URL: https://goldennftplatform-svg.github.io/29/
      # The custom domain is only valid when a CNAME is actually published.
      # Without one, a bare forwarder 404s every subpath while "/" still
      # redirects — exactly the partial break CI caught on 2026-10-06.
      - name: Test the custom domain (only when published)
        if: hashFiles('CNAME') != ''
        run: |
          domain=$(tr -d '[:space:]' < CNAME)
          echo "Testing https://${domain}/"
          PUBLIC_URL="https://${domain}/" node tests/public-browser.cjs
          served=$(curl -fsSL "https://${domain}/game.js?revision=$GITHUB_SHA" | sha256sum | cut -d' ' -f1)
          local=$(sha256sum game.js | cut -d' ' -f1)
          if [ "$served" != "$local" ]; then
            echo "::error::${domain} is serving a different game.js than this commit"
            exit 1
          fi
          echo "custom domain ${domain} matches commit $GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-browser-evidence
          path: public-evidence/
