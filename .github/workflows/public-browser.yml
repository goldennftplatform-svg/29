name: Public Pages browser test
on:
  workflow_dispatch:
jobs:
  public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/public-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-browser-evidence
          path: public-evidence/
